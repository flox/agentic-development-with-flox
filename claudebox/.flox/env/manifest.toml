## Flox Environment Manifest -----------------------------------------
##
##   _Everything_ you need to know about the _manifest_ is here:
##
##   https://flox.dev/docs/reference/command-reference/manifest.toml/
##
## -------------------------------------------------------------------
# Flox manifest version managed by Flox CLI
version = 1


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
claudebox.pkg-path = "agent-stacks/claudebox"
claudebox.systems = ["x86_64-linux"]
claudebox.pkg-group = "claudebox"
claude-code.pkg-path = "claude-code"
tmux.pkg-path = "tmux"
bat.pkg-path = "bat"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
[hook]
on-activate = '''
# claudebox-vertical, claudebox-no-monitor, claudebox-minimal, claudebox-help are scripts rather than [profile] functions, so
# each is written once for every shell and also works in scripts, agents, and
# `flox activate -- <name>`. They read the environment when they run.
# A script is moved into place only when it changed
install_claudebox_script() {
    local tmp="$1" dest="$2"
    if cmp -s "$tmp" "$dest"; then
        rm -f "$tmp"
    else
        chmod +x "$tmp"
        mv -f "$tmp" "$dest"
    fi
}

setup_claudebox_helpers() {
    local bin_dir="$FLOX_ENV_CACHE/bin"
    mkdir -p "$bin_dir"
    cat > "$bin_dir/.claudebox-vertical.$$" << 'CLAUDEBOX_VERTICAL_SCRIPT'
#!/usr/bin/env bash
claudebox-vertical() {
    claudebox --split-direction vertical "$@"
}
claudebox-vertical "$@"
CLAUDEBOX_VERTICAL_SCRIPT
    install_claudebox_script "$bin_dir/.claudebox-vertical.$$" "$bin_dir/claudebox-vertical"
    cat > "$bin_dir/.claudebox-no-monitor.$$" << 'CLAUDEBOX_NO_MONITOR_SCRIPT'
#!/usr/bin/env bash
claudebox-no-monitor() {
    claudebox --no-monitor "$@"
}
claudebox-no-monitor "$@"
CLAUDEBOX_NO_MONITOR_SCRIPT
    install_claudebox_script "$bin_dir/.claudebox-no-monitor.$$" "$bin_dir/claudebox-no-monitor"
    cat > "$bin_dir/.claudebox-minimal.$$" << 'CLAUDEBOX_MINIMAL_SCRIPT'
#!/usr/bin/env bash
claudebox-minimal() {
    claudebox --no-tmux-config --no-monitor "$@"
}
claudebox-minimal "$@"
CLAUDEBOX_MINIMAL_SCRIPT
    install_claudebox_script "$bin_dir/.claudebox-minimal.$$" "$bin_dir/claudebox-minimal"
    cat > "$bin_dir/.claudebox-help.$$" << 'CLAUDEBOX_HELP_SCRIPT'
#!/usr/bin/env bash
claudebox-help() {
    claudebox --help
}
claudebox-help "$@"
CLAUDEBOX_HELP_SCRIPT
    install_claudebox_script "$bin_dir/.claudebox-help.$$" "$bin_dir/claudebox-help"
    case ":$PATH:" in *":$bin_dir:"*) ;; *) export PATH="$bin_dir:$PATH" ;; esac
}

setup_claudebox_helpers

echo ""
echo "Claudebox - Sandboxed Claude Code Environment"
echo ""
echo "Claudebox wraps Claude Code in a lightweight sandbox for transparency:"
echo "  • Shadows \$HOME (no credentials except ~/.claude)"
echo "  • Mounts project parent read-only"
echo "  • Shows executed commands in real-time via tmux"
echo ""
echo "Usage:"
echo "  claudebox                    # Start with default settings"
echo "  claudebox-vertical           # Start with vertical split"
echo "  claudebox-no-monitor         # Start without tmux monitoring"
echo "  claudebox --help             # Show all options"
echo ""
echo "Note: Not a security boundary - designed for transparency, not isolation."
echo ""
'''


