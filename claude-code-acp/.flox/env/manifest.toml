schema-version = "1.11.0"

[install]
# @agentclientprotocol/claude-agent-acp, the successor to the deprecated
# @zed-industries/claude-code-acp. It runs its own Claude Code build
# (CLAUDE_CODE_EXECUTABLE), so nothing else is needed
claude-agent-acp.pkg-path = "agent-stacks/claude-agent-acp"

[hook]
on-activate = '''
echo ""
echo "Claude Agent ACP - Agent Client Protocol adapter for Claude Code"
echo ""
if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
  echo "Sign in: export ANTHROPIC_API_KEY=..., or log in to Claude Code once (claude /login)"
  echo ""
fi
echo "An ACP client (Zed, Neovim, Emacs, marimo, ...) starts the adapter itself."
echo "Point it at:"
echo "  $FLOX_ENV/bin/claude-agent-acp"
echo ""
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
