schema-version = "1.11.0"

[install]
vibe-kanban.pkg-path = "agent-stacks/vibe-kanban"
vibe-kanban.pkg-group = "vibe-kanban"

# Vibe Kanban runs coding agents with `npx -y <agent>@<version>`
# (override per agent in profiles.json), so npx has to be on PATH
nodejs.pkg-path = "nodejs"

git.pkg-path = "gitFull"
git.outputs = "all"
curl.pkg-path = "curl"
bat.pkg-path = "bat"

[hook]
on-activate = '''
# vibe-kanban-info is a script rather than a [profile] function, so it's written once
# for every shell and also works in scripts, agents, and
# `flox activate -- vibe-kanban-info`. It reads the environment when it runs.
# A script is moved into place only when it changed
install_vibe_kanban_script() {
    local tmp="$1" dest="$2"
    if cmp -s "$tmp" "$dest"; then
        rm -f "$tmp"
    else
        chmod +x "$tmp"
        mv -f "$tmp" "$dest"
    fi
}

setup_vibe_kanban_info() {
    local bin_dir="$FLOX_ENV_CACHE/bin"
    mkdir -p "$bin_dir"
    { echo '#!/usr/bin/env bash'
      printf 'FLOX_ENV=%q FLOX_ENV_CACHE=%q FLOX_ENV_PROJECT=%q\n' "$FLOX_ENV" "$FLOX_ENV_CACHE" "$FLOX_ENV_PROJECT"
      cat << 'VIBE_KANBAN_INFO'
echo "Vibe Kanban Environment Configuration"
echo ""
echo "Service URL: http://$VIBE_KANBAN_HOST:$VIBE_KANBAN_PORT"
echo "Service log: $FLOX_ENV_CACHE/logs/vibe-kanban.log"
echo "Open browser on service start: $VIBE_KANBAN_OPEN_BROWSER (VIBE_KANBAN_OPEN_BROWSER)"
echo ""
echo "Commands:"
echo "  flox activate -s             Start the Vibe Kanban service"
echo "  flox services status         Check the service"
echo "  vibe-kanban                  Run in the foreground (random port, opens browser)"
echo "  vibe-kanban-mcp --mode global  MCP server for managing tasks from an agent"
echo ""
echo "Data: ~/.local/share/vibe-kanban (Linux), ~/Library/Application Support/ai.bloop.vibe-kanban (macOS)"
echo "Source: https://github.com/BloopAI/vibe-kanban"
VIBE_KANBAN_INFO
    } > "$bin_dir/.vibe-kanban-info.$$"
    install_vibe_kanban_script "$bin_dir/.vibe-kanban-info.$$" "$bin_dir/vibe-kanban-info"
    case ":$PATH:" in *":$bin_dir:"*) ;; *) export PATH="$bin_dir:$PATH" ;; esac
}

setup_vibe_kanban_info

# Listen address for the service; override at activation, e.g.
#   VIBE_KANBAN_PORT=4000 flox activate -s
export VIBE_KANBAN_HOST="${VIBE_KANBAN_HOST:-127.0.0.1}"
export VIBE_KANBAN_PORT="${VIBE_KANBAN_PORT:-3210}"
# Vibe Kanban opens a browser tab whenever it starts; the service does not,
# unless VIBE_KANBAN_OPEN_BROWSER=true
export VIBE_KANBAN_OPEN_BROWSER="${VIBE_KANBAN_OPEN_BROWSER:-false}"
mkdir -p "$FLOX_ENV_CACHE/logs"

# === DISPLAY CONFIGURATION ===
echo ""
echo "Vibe Kanban environment ready"
echo ""
if [ "$FLOX_ACTIVATE_START_SERVICES" = "true" ]; then
  echo "  Service: starting at http://$VIBE_KANBAN_HOST:$VIBE_KANBAN_PORT"
else
  echo "  Service: not started (use flox activate -s, or flox services start)"
fi
echo ""
echo "  Agents run with their permission prompts turned off by default;"
echo "  change this in the agent settings of the web UI."
echo ""

echo "Commands:"
echo "  flox activate -s             Start the Vibe Kanban service"
echo "  vibe-kanban                  Run in the foreground (random port, opens browser)"
echo "  flox services logs vibe-kanban  Show service logs"
echo "  vibe-kanban-info             Show configuration"
echo ""
'''

[services]
vibe-kanban.command = '''
# Vibe Kanban opens $BROWSER when set; `true` makes that a no-op
if [ "$VIBE_KANBAN_OPEN_BROWSER" != "true" ]; then
  export BROWSER=true
fi
HOST="$VIBE_KANBAN_HOST" PORT="$VIBE_KANBAN_PORT" exec vibe-kanban >> "$FLOX_ENV_CACHE/logs/vibe-kanban.log" 2>&1
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
