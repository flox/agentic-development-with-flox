schema-version = "1.11.0"

[install]
nodejs_22.pkg-path = "nodejs_22"
git.pkg-path = "gitFull"
git.outputs = "all"
curl.pkg-path = "curl"
bat.pkg-path = "bat"

[vars]
npm_config_prefix = "$FLOX_ENV_CACHE/npm-global"

# API keys - set in your shell profile or pass at activation time
# ANTHROPIC_API_KEY = ""
# OPENAI_API_KEY = ""

[hook]
on-activate = '''
# ruflo-info, ruflo-update are scripts rather than [profile] functions, so
# each is written once for every shell and also works in scripts, agents, and
# `flox activate -- <name>`. They read the environment when they run.
# A script is moved into place only when it changed
install_ruflo_script() {
    local tmp="$1" dest="$2"
    if cmp -s "$tmp" "$dest"; then
        rm -f "$tmp"
    else
        chmod +x "$tmp"
        mv -f "$tmp" "$dest"
    fi
}

setup_ruflo_helpers() {
    local bin_dir="$FLOX_ENV_CACHE/bin"
    mkdir -p "$bin_dir"
    { echo '#!/usr/bin/env bash'
      printf 'FLOX_ENV=%q FLOX_ENV_CACHE=%q FLOX_ENV_PROJECT=%q\n' "$FLOX_ENV" "$FLOX_ENV_CACHE" "$FLOX_ENV_PROJECT"
      cat << 'RUFLO_INFO_SCRIPT'
ruflo-info() {
    echo "Ruflo Environment Configuration"
    echo ""
    echo "API Keys:"
    [ -n "$ANTHROPIC_API_KEY" ] && echo "  Anthropic: set" || echo "  Anthropic: not set"
    [ -n "$OPENAI_API_KEY" ] && echo "  OpenAI: set" || echo "  OpenAI: not set"
    echo ""
    echo "Commands:"
    echo "  ruflo init --wizard          Interactive setup"
    echo "  ruflo swarm                  Manage agent swarms"
    echo "  ruflo agents                 List/configure agents"
    echo "  ruflo router                 Configure routing"
    echo "  ruflo memory                 Knowledge graph + vector store"
    echo "  ruflo optimize               Run optimization workers"
    echo "  ruflo audit                  Run security audits"
    echo "  ruflo session                Persist/restore/export sessions"
    echo "  ruflo plugins                Manage plugins"
    echo "  ruflo hooks intelligence --status  Check RuVector status"
    echo ""
    echo "Providers: Anthropic (primary), OpenAI, Google Gemini,"
    echo "  Cohere, Ollama, with automatic failover"
    echo ""
    echo "Update: ruflo-update"
}
ruflo-info "$@"
RUFLO_INFO_SCRIPT
    } > "$bin_dir/.ruflo-info.$$"
    install_ruflo_script "$bin_dir/.ruflo-info.$$" "$bin_dir/ruflo-info"
    { echo '#!/usr/bin/env bash'
      printf 'FLOX_ENV=%q FLOX_ENV_CACHE=%q FLOX_ENV_PROJECT=%q\n' "$FLOX_ENV" "$FLOX_ENV_CACHE" "$FLOX_ENV_PROJECT"
      cat << 'RUFLO_UPDATE_SCRIPT'
ruflo-update() {
    npm install -g ruflo@latest
}
ruflo-update "$@"
RUFLO_UPDATE_SCRIPT
    } > "$bin_dir/.ruflo-update.$$"
    install_ruflo_script "$bin_dir/.ruflo-update.$$" "$bin_dir/ruflo-update"
    case ":$PATH:" in *":$bin_dir:"*) ;; *) export PATH="$bin_dir:$PATH" ;; esac
}

setup_ruflo_helpers

# === RUFLO INSTALLATION ===
export npm_config_prefix="$FLOX_ENV_CACHE/npm-global"
export PATH="$FLOX_ENV_CACHE/npm-global/bin:$PATH"
# [profile] keeps this directory ahead of layered environments
export FLOXENV_RUFLO_BIN_DIR="$FLOX_ENV_CACHE/npm-global/bin"

# Install ruflo globally if not present
if [ ! -f "$FLOX_ENV_CACHE/npm-global/bin/ruflo" ]; then
  echo "Installing ruflo..."
  npm install -g ruflo@latest --quiet 2>/dev/null
  echo ""
fi

# === DISPLAY CONFIGURATION ===
echo ""
echo "Ruflo environment ready"
echo ""

# Show API key status
_has_key=0
if [ -n "$ANTHROPIC_API_KEY" ]; then
  echo "  Anthropic API key: set"
  _has_key=1
else
  echo "  Anthropic API key: not set"
fi
if [ -n "$OPENAI_API_KEY" ]; then
  echo "  OpenAI API key: set"
  _has_key=1
else
  echo "  OpenAI API key: not set"
fi
echo ""

if [ "$_has_key" = "0" ]; then
  echo "  Set an API key:"
  echo "    export ANTHROPIC_API_KEY=sk-ant-..."
  echo ""
fi

echo "Commands:"
echo "  ruflo init --wizard          Interactive first-time setup"
echo "  ruflo swarm                  Manage agent swarms"
echo "  ruflo agents                 List and configure agents"
echo "  ruflo router                 Configure routing policies"
echo "  ruflo memory                 Manage knowledge graph and vector store"
echo "  ruflo-info                   Show configuration"
echo "  ruflo-update                 Update to latest version"
echo ""

unset _has_key
'''

[profile]
bash = '''
if [ -n "$FLOXENV_RUFLO_BIN_DIR" ]; then
    # Layering another environment on top puts its bin directories ahead of
    # this one's npm packages; move them back to the front
    floxenv_ruflo_front_dir="$FLOXENV_RUFLO_BIN_DIR"
    case ":$PATH:" in
        ":$floxenv_ruflo_front_dir:"*) ;;
        *)
            # Drop the copy further down, so PATH doesn't grow each time
            floxenv_ruflo_front_path=":$PATH:"
            while [ "${floxenv_ruflo_front_path#*:"$floxenv_ruflo_front_dir":}" != "$floxenv_ruflo_front_path" ]; do
                floxenv_ruflo_front_path="${floxenv_ruflo_front_path%%:"$floxenv_ruflo_front_dir":*}:${floxenv_ruflo_front_path#*:"$floxenv_ruflo_front_dir":}"
            done
            floxenv_ruflo_front_path="${floxenv_ruflo_front_path#:}"
            PATH="$floxenv_ruflo_front_dir${floxenv_ruflo_front_path:+:${floxenv_ruflo_front_path%:}}"
            ;;
    esac
    unset floxenv_ruflo_front_dir floxenv_ruflo_front_path
fi
'''

zsh = '''
if [ -n "$FLOXENV_RUFLO_BIN_DIR" ]; then
    # Layering another environment on top puts its bin directories ahead of
    # this one's npm packages; move them back to the front
    floxenv_ruflo_front_dir="$FLOXENV_RUFLO_BIN_DIR"
    case ":$PATH:" in
        ":$floxenv_ruflo_front_dir:"*) ;;
        *)
            # Drop the copy further down, so PATH doesn't grow each time
            floxenv_ruflo_front_path=":$PATH:"
            while [ "${floxenv_ruflo_front_path#*:"$floxenv_ruflo_front_dir":}" != "$floxenv_ruflo_front_path" ]; do
                floxenv_ruflo_front_path="${floxenv_ruflo_front_path%%:"$floxenv_ruflo_front_dir":*}:${floxenv_ruflo_front_path#*:"$floxenv_ruflo_front_dir":}"
            done
            floxenv_ruflo_front_path="${floxenv_ruflo_front_path#:}"
            PATH="$floxenv_ruflo_front_dir${floxenv_ruflo_front_path:+:${floxenv_ruflo_front_path%:}}"
            ;;
    esac
    unset floxenv_ruflo_front_dir floxenv_ruflo_front_path
fi
'''

fish = '''
if set -q FLOXENV_RUFLO_BIN_DIR
    # Layering another environment on top puts its bin directories ahead of
    # this one's npm packages; move them back to the front
    set -gx PATH $FLOXENV_RUFLO_BIN_DIR (string match -v -- $FLOXENV_RUFLO_BIN_DIR $PATH)
end
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
