schema-version = "1.11.0"

[install]
nullclaw.pkg-path = "flox/nullclaw"
nullclaw.pkg-group = "nullclaw"
git.pkg-path = "gitFull"
git.outputs = "all"
curl.pkg-path = "curl"
bat.pkg-path = "bat"

[vars]
NULLCLAW_HOME = "$FLOX_ENV_CACHE/nullclaw"
NULLCLAW_GATEWAY_PORT = "8080"

# API keys - set in your shell profile or pass at activation time
# ANTHROPIC_API_KEY = ""
# OPENAI_API_KEY = ""
# OPENROUTER_API_KEY = ""  (recommended - access to 50+ providers)

[hook]
on-activate = '''
# nullclaw-info is a script rather than a [profile] function, so it's written once
# for every shell and also works in scripts, agents, and
# `flox activate -- nullclaw-info`. It reads the environment when it runs.
# A script is moved into place only when it changed
install_nullclaw_script() {
    local tmp="$1" dest="$2"
    if cmp -s "$tmp" "$dest"; then
        rm -f "$tmp"
    else
        chmod +x "$tmp"
        mv -f "$tmp" "$dest"
    fi
}

setup_nullclaw_info() {
    local bin_dir="$FLOX_ENV_CACHE/bin"
    mkdir -p "$bin_dir"
    cat > "$bin_dir/.nullclaw-info.$$" << 'NULLCLAW_INFO'
#!/usr/bin/env bash
echo "NullClaw Environment Configuration"
echo ""
echo "NULLCLAW_HOME: ${NULLCLAW_HOME}"
echo ""
echo "API Keys:"
[ -n "$ANTHROPIC_API_KEY" ] && echo "  Anthropic: set" || echo "  Anthropic: not set"
[ -n "$OPENAI_API_KEY" ] && echo "  OpenAI: set" || echo "  OpenAI: not set"
[ -n "$OPENROUTER_API_KEY" ] && echo "  OpenRouter: set" || echo "  OpenRouter: not set"
echo ""
echo "Commands:"
echo "  nullclaw                     Interactive REPL"
echo "  nullclaw agent -m \"<msg>\"    Single-message chat"
echo "  nullclaw onboard             Quick API setup"
echo "  nullclaw gateway             Start HTTP gateway"
echo "  nullclaw status              System status"
echo "  nullclaw doctor              Full diagnostics"
echo "  nullclaw channel start <ch>  Start a messaging channel"
echo "  nullclaw channel status      Channel health check"
echo "  nullclaw migrate openclaw    Migrate from OpenClaw"
echo "  flox activate -s             Start gateway as Flox service"
echo ""
echo "Providers: OpenRouter (recommended), Anthropic, OpenAI, Gemini,"
echo "  Ollama, Groq, Mistral, xAI, DeepSeek, 50+ total"
echo ""
echo "Channels: CLI, Telegram, Signal, Discord, Slack, iMessage,"
echo "  Matrix, WhatsApp, IRC, Email, 19 total"
echo ""
echo "Memory: SQLite (default), PostgreSQL, Redis, ClickHouse,"
echo "  LanceDB, Markdown, 10 engines total"
echo ""
echo "Config: ~/.nullclaw/config.json"
NULLCLAW_INFO
    install_nullclaw_script "$bin_dir/.nullclaw-info.$$" "$bin_dir/nullclaw-info"
    case ":$PATH:" in *":$bin_dir:"*) ;; *) export PATH="$bin_dir:$PATH" ;; esac
}

setup_nullclaw_info

# === NULLCLAW HOME ===
export NULLCLAW_HOME="${NULLCLAW_HOME:-$FLOX_ENV_CACHE/nullclaw}"
mkdir -p "$NULLCLAW_HOME"

# === GATEWAY PORT ===
export NULLCLAW_GATEWAY_PORT="${NULLCLAW_GATEWAY_PORT:-8080}"

# === DISPLAY CONFIGURATION ===
echo ""
echo "NullClaw environment ready"
echo ""

# Show API key status
_has_key=0
if [ -n "$ANTHROPIC_API_KEY" ]; then
  echo "  Anthropic API key: set"
  _has_key=1
else
  echo "  Anthropic API key: not set"
fi
if [ -n "$OPENAI_API_KEY" ]; then
  echo "  OpenAI API key: set"
  _has_key=1
else
  echo "  OpenAI API key: not set"
fi
if [ -n "$OPENROUTER_API_KEY" ]; then
  echo "  OpenRouter API key: set"
  _has_key=1
else
  echo "  OpenRouter API key: not set"
fi
echo "  NULLCLAW_HOME: $NULLCLAW_HOME"
echo ""

if [ "$_has_key" = "0" ]; then
  echo "  Set an API key or run onboarding:"
  echo "    export OPENROUTER_API_KEY=sk-or-..."
  echo "    nullclaw onboard --interactive"
  echo ""
fi

echo "Commands:"
echo "  nullclaw                     Interactive REPL"
echo "  nullclaw agent -m \"<msg>\"    Single-message chat"
echo "  nullclaw onboard             Quick API setup"
echo "  nullclaw status              System status"
echo "  nullclaw doctor              Full diagnostics"
echo "  nullclaw-info                Show configuration"
echo ""
echo "Gateway (flox activate -s):"
echo "  Starts HTTP gateway on port $NULLCLAW_GATEWAY_PORT"
echo "  Check logs for pairing code: flox services logs nullclaw-gateway"
echo ""

# First-time setup check
if [ ! -f "$NULLCLAW_HOME/config.json" ] && [ ! -f "$HOME/.nullclaw/config.json" ]; then
  echo "First time? Run: nullclaw onboard --interactive"
  echo ""
fi

unset _has_key
'''

[services.nullclaw-gateway]
command = """
export NULLCLAW_HOME="${NULLCLAW_HOME:-$FLOX_ENV_CACHE/nullclaw}"
exec nullclaw gateway --port "${NULLCLAW_GATEWAY_PORT:-8080}" 2>&1
"""
is-daemon = false

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
