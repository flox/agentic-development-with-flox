version = 1


## Install Packages --------------------------------------------------
[install]
# llama.cpp with CUDA on Linux
llama-cpp.pkg-path = "flox-cuda/llama-cpp"
llama-cpp.systems = ["x86_64-linux", "aarch64-linux"]
llama-cpp.pkg-group = "llama-cpp"
# llama.cpp with Metal on Apple Silicon
llama-cpp-metal.pkg-path = "llama-cpp"
llama-cpp-metal.systems = ["aarch64-darwin"]
llama-cpp-metal.pkg-group = "llama-cpp-metal"
# hf CLI, for `hf auth login` (gated models) and pre-downloading models
huggingface-hub.pkg-path = "python312Packages.huggingface-hub"


## Environment Variables ---------------------------------------------
[vars]
# All user-tunable vars live in [hook.on-activate] with ${VAR:-default}
# fallbacks so they can be overridden via environment variables at
# activation time (e.g., LLAMACPP_MODEL=org/repo:Q4_K_M flox activate -s).


## Activation Hook ---------------------------------------------------
[hook]
on-activate = '''
  # Model: a Hugging Face GGUF repo as org/repo[:quant], which llama-server
  # downloads itself on first start (no token needed for public repos; set
  # HF_TOKEN for gated ones), or a path to a local .gguf file
  export LLAMACPP_MODEL="${LLAMACPP_MODEL:-unsloth/Phi-4-mini-instruct-GGUF:Q8_0}"
  export LLAMACPP_MODELS_DIR="${LLAMACPP_MODELS_DIR:-$FLOX_ENV_PROJECT/models}"
  # llama-server keeps Hugging Face downloads here
  export LLAMA_CACHE="${LLAMA_CACHE:-$LLAMACPP_MODELS_DIR}"

  # Server
  export LLAMACPP_HOST="${LLAMACPP_HOST:-0.0.0.0}"
  export LLAMACPP_PORT="${LLAMACPP_PORT:-8080}"

  # Engine tuning
  export LLAMACPP_N_GPU_LAYERS="${LLAMACPP_N_GPU_LAYERS:-99}"
  export LLAMACPP_CTX_SIZE="${LLAMACPP_CTX_SIZE:-0}"
  export LLAMACPP_PARALLEL="${LLAMACPP_PARALLEL:-4}"
  export LLAMACPP_BATCH_SIZE="${LLAMACPP_BATCH_SIZE:-}"
  export LLAMACPP_UBATCH_SIZE="${LLAMACPP_UBATCH_SIZE:-}"
  export LLAMACPP_FLASH_ATTN="${LLAMACPP_FLASH_ATTN:-true}"
  export LLAMACPP_CONT_BATCHING="${LLAMACPP_CONT_BATCHING:-true}"

  # KV cache
  export LLAMACPP_CACHE_TYPE_K="${LLAMACPP_CACHE_TYPE_K:-}"
  export LLAMACPP_CACHE_TYPE_V="${LLAMACPP_CACHE_TYPE_V:-}"

  # Multi-GPU
  export LLAMACPP_SPLIT_MODE="${LLAMACPP_SPLIT_MODE:-}"
  export LLAMACPP_TENSOR_SPLIT="${LLAMACPP_TENSOR_SPLIT:-}"
  export LLAMACPP_MAIN_GPU="${LLAMACPP_MAIN_GPU:-}"

  # Serving
  export LLAMACPP_ALIAS="${LLAMACPP_ALIAS:-}"
  export LLAMACPP_API_KEY="${LLAMACPP_API_KEY:-}"
  export LLAMACPP_API_KEY_FILE="${LLAMACPP_API_KEY_FILE:-}"
  export LLAMACPP_METRICS="${LLAMACPP_METRICS:-true}"
  export LLAMACPP_JINJA="${LLAMACPP_JINJA:-true}"
  export LLAMACPP_CHAT_TEMPLATE="${LLAMACPP_CHAT_TEMPLATE:-}"
  export LLAMACPP_EMBEDDING="${LLAMACPP_EMBEDDING:-}"
  export LLAMACPP_WEBUI="${LLAMACPP_WEBUI:-false}"
  export LLAMACPP_REASONING_FORMAT="${LLAMACPP_REASONING_FORMAT:-}"

  # Misc
  export LLAMACPP_THREADS="${LLAMACPP_THREADS:-}"
  export LLAMACPP_TIMEOUT="${LLAMACPP_TIMEOUT:-}"
  # Extra llama-server arguments, split on whitespace
  export LLAMACPP_EXTRA_ARGS="${LLAMACPP_EXTRA_ARGS:-}"

  mkdir -p "$LLAMACPP_MODELS_DIR"

  # llamacpp-serve builds the llama-server command line from the LLAMACPP_*
  # variables and runs it; the llamacpp service runs it, and arguments given
  # to it go to llama-server. It's a script rather than the service command
  # because process-compose parses $ expressions in service commands and
  # rejects bash arrays and positional parameters.
  # A script is moved into place only when it changed
  install_llamacpp_script() {
    local tmp="$1" dest="$2"
    if cmp -s "$tmp" "$dest"; then
      rm -f "$tmp"
    else
      chmod +x "$tmp"
      mv -f "$tmp" "$dest"
    fi
  }
  llamacpp_bin_dir="$FLOX_ENV_CACHE/bin"
  mkdir -p "$llamacpp_bin_dir"
  cat > "$llamacpp_bin_dir/.llamacpp-serve.$$" << 'LLAMACPP_SERVE_SCRIPT'
#!/usr/bin/env bash
llamacpp_truthy() {
  case "$1" in 1|[Tt][Rr][Uu][Ee]|[Yy][Ee][Ss]|[Oo][Nn]) return 0 ;; *) return 1 ;; esac
}
# Prints the flag for a true value, the other one for false, nothing when unset
llamacpp_toggle() {
  [ -n "$1" ] || return 0
  if llamacpp_truthy "$1"; then printf '%s\n' "$2"; else printf '%s\n' "$3"; fi
}

args=()
case "$LLAMACPP_MODEL" in
  "")
    echo "LLAMACPP_MODEL is empty: set it to org/repo[:quant] or a .gguf path" >&2
    exit 1
    ;;
  *.gguf)
    model_path="$LLAMACPP_MODEL"
    [ -f "$model_path" ] || model_path="$LLAMACPP_MODELS_DIR/$LLAMACPP_MODEL"
    if [ ! -f "$model_path" ]; then
      echo "GGUF file not found: $LLAMACPP_MODEL (also looked in $LLAMACPP_MODELS_DIR)" >&2
      exit 1
    fi
    args+=(-m "$model_path")
    ;;
  *)
    args+=(-hf "$LLAMACPP_MODEL")
    ;;
esac

args+=(--host "$LLAMACPP_HOST" --port "$LLAMACPP_PORT"
       -ngl "$LLAMACPP_N_GPU_LAYERS" -c "$LLAMACPP_CTX_SIZE" -np "$LLAMACPP_PARALLEL")
[ -n "$LLAMACPP_BATCH_SIZE" ] && args+=(-b "$LLAMACPP_BATCH_SIZE")
[ -n "$LLAMACPP_UBATCH_SIZE" ] && args+=(-ub "$LLAMACPP_UBATCH_SIZE")
[ -n "$LLAMACPP_FLASH_ATTN" ] && args+=(-fa "$(llamacpp_toggle "$LLAMACPP_FLASH_ATTN" on off)")
[ -n "$LLAMACPP_CONT_BATCHING" ] && args+=("$(llamacpp_toggle "$LLAMACPP_CONT_BATCHING" --cont-batching --no-cont-batching)")
[ -n "$LLAMACPP_CACHE_TYPE_K" ] && args+=(-ctk "$LLAMACPP_CACHE_TYPE_K")
[ -n "$LLAMACPP_CACHE_TYPE_V" ] && args+=(-ctv "$LLAMACPP_CACHE_TYPE_V")
[ -n "$LLAMACPP_SPLIT_MODE" ] && args+=(-sm "$LLAMACPP_SPLIT_MODE")
[ -n "$LLAMACPP_TENSOR_SPLIT" ] && args+=(-ts "$LLAMACPP_TENSOR_SPLIT")
[ -n "$LLAMACPP_MAIN_GPU" ] && args+=(-mg "$LLAMACPP_MAIN_GPU")
[ -n "$LLAMACPP_ALIAS" ] && args+=(-a "$LLAMACPP_ALIAS")
# The key goes in the environment, not on the command line
[ -n "$LLAMACPP_API_KEY" ] && export LLAMA_API_KEY="$LLAMACPP_API_KEY"
[ -n "$LLAMACPP_API_KEY_FILE" ] && args+=(--api-key-file "$LLAMACPP_API_KEY_FILE")
llamacpp_truthy "$LLAMACPP_METRICS" && args+=(--metrics)
[ -n "$LLAMACPP_JINJA" ] && args+=("$(llamacpp_toggle "$LLAMACPP_JINJA" --jinja --no-jinja)")
[ -n "$LLAMACPP_CHAT_TEMPLATE" ] && args+=(--chat-template "$LLAMACPP_CHAT_TEMPLATE")
llamacpp_truthy "$LLAMACPP_EMBEDDING" && args+=(--embedding)
[ -n "$LLAMACPP_WEBUI" ] && args+=("$(llamacpp_toggle "$LLAMACPP_WEBUI" --webui --no-webui)")
[ -n "$LLAMACPP_TIMEOUT" ] && args+=(-to "$LLAMACPP_TIMEOUT")
[ -n "$LLAMACPP_THREADS" ] && args+=(-t "$LLAMACPP_THREADS")
[ -n "$LLAMACPP_REASONING_FORMAT" ] && args+=(--reasoning-format "$LLAMACPP_REASONING_FORMAT")
# shellcheck disable=SC2206
[ -n "$LLAMACPP_EXTRA_ARGS" ] && args+=($LLAMACPP_EXTRA_ARGS)

echo "llama-server ${args[*]}" >&2
exec llama-server "${args[@]}" "$@"
LLAMACPP_SERVE_SCRIPT
  install_llamacpp_script "$llamacpp_bin_dir/.llamacpp-serve.$$" "$llamacpp_bin_dir/llamacpp-serve"
  case ":$PATH:" in *":$llamacpp_bin_dir:"*) ;; *) export PATH="$llamacpp_bin_dir:$PATH" ;; esac
  unset llamacpp_bin_dir
'''


## Profile script ----------------------------------------------------
[profile]


## Services ---------------------------------------------------------
[services]
llamacpp.command = '"$FLOX_ENV_CACHE/bin/llamacpp-serve"'


## Include ----------------------------------------------------------
[include]


## Build and publish your own packages ------------------------------
[build]


## Other Environment Options -----------------------------------------
[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
