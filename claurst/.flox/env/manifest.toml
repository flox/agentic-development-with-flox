schema-version = "1.11.0"

[install]
claurst.pkg-path = "flox/claurst"
claurst.pkg-group = "claurst"
git.pkg-path = "gitFull"
git.outputs = "all"
curl.pkg-path = "curl"
bat.pkg-path = "bat"

[vars]
# API keys - set in your shell profile or pass at activation time
# ANTHROPIC_API_KEY = ""
# OPENAI_API_KEY = ""

# Or use /connect inside claurst to configure providers interactively

[hook]
on-activate = '''
# claurst-info is a script rather than a [profile] function, so it's written once
# for every shell and also works in scripts, agents, and
# `flox activate -- claurst-info`. It reads the environment when it runs.
# A script is moved into place only when it changed
install_claurst_script() {
    local tmp="$1" dest="$2"
    if cmp -s "$tmp" "$dest"; then
        rm -f "$tmp"
    else
        chmod +x "$tmp"
        mv -f "$tmp" "$dest"
    fi
}

setup_claurst_info() {
    local bin_dir="$FLOX_ENV_CACHE/bin"
    mkdir -p "$bin_dir"
    cat > "$bin_dir/.claurst-info.$$" << 'CLAURST_INFO'
#!/usr/bin/env bash
echo "Claurst Environment Configuration"
echo ""
echo "API Keys:"
[ -n "$ANTHROPIC_API_KEY" ] && echo "  Anthropic: set" || echo "  Anthropic: not set"
[ -n "$OPENAI_API_KEY" ] && echo "  OpenAI: set" || echo "  OpenAI: not set"
echo ""
echo "Commands:"
echo "  claurst                      Start interactive TUI"
echo "  claurst -p \"<prompt>\"        Headless single query"
echo ""
echo "In-app commands:"
echo "  /connect       Configure an LLM provider"
echo "  /compact       Compact conversation context"
echo "  /diff          Show changes"
echo "  /plan          Plan mode"
echo "  /mcp           MCP server management"
echo ""
echo "Providers: Anthropic, OpenAI, Google, GitHub Copilot,"
echo "  Ollama, DeepSeek, Groq, Mistral, 30+ more"
echo ""
echo "Docs: https://claurst.kuber.studio/docs"
CLAURST_INFO
    install_claurst_script "$bin_dir/.claurst-info.$$" "$bin_dir/claurst-info"
    case ":$PATH:" in *":$bin_dir:"*) ;; *) export PATH="$bin_dir:$PATH" ;; esac
}

setup_claurst_info

# === DISPLAY CONFIGURATION ===
echo ""
echo "Claurst environment ready"
echo ""

# Show API key status
_has_key=0
if [ -n "$ANTHROPIC_API_KEY" ]; then
  echo "  Anthropic API key: set"
  _has_key=1
else
  echo "  Anthropic API key: not set"
fi
if [ -n "$OPENAI_API_KEY" ]; then
  echo "  OpenAI API key: set"
  _has_key=1
else
  echo "  OpenAI API key: not set"
fi
echo ""

if [ "$_has_key" = "0" ]; then
  echo "  Set an API key or configure interactively:"
  echo "    export ANTHROPIC_API_KEY=sk-ant-..."
  echo "    export OPENAI_API_KEY=sk-..."
  echo "    claurst  then  /connect"
  echo ""
fi

echo "Commands:"
echo "  claurst                      Start interactive TUI"
echo "  claurst -p \"<prompt>\"        Headless single query"
echo "  claurst-info                 Show configuration"
echo ""
echo "In-app commands:"
echo "  /connect                     Configure an LLM provider"
echo "  /compact                     Compact conversation context"
echo "  /diff                        Show changes"
echo ""

unset _has_key
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
