## Flox Environment Manifest -----------------------------------------
##
##   _Everything_ you need to know about the _manifest_ is here:
##
##   https://flox.dev/docs/reference/command-reference/manifest.toml/
##
## -------------------------------------------------------------------
schema-version = "1.11.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
# Flox build of Codex: loads skills from CODEX_FLOX_SKILL_ROOTS
codex.pkg-path = "agent-stacks/codex"
codex.pkg-group = "codex"

# Flox skills (flox, floxify, flox-debug) - teach Codex to manage Flox environments
agent-plugin-flox.pkg-path = "agent-stacks/agent-plugin-flox"
agent-plugin-flox.pkg-group = "flox-skills"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
[hook]
on-activate = '''
# codex-config, codex-policy are scripts rather than [profile] functions, so
# each is written once for every shell and also works in scripts, agents, and
# `flox activate -- <name>`. They read the environment when they run.
# A script is moved into place only when it changed
install_codex_script() {
    local tmp="$1" dest="$2"
    if cmp -s "$tmp" "$dest"; then
        rm -f "$tmp"
    else
        chmod +x "$tmp"
        mv -f "$tmp" "$dest"
    fi
}

setup_codex_helpers() {
    local bin_dir="$FLOX_ENV_CACHE/bin"
    mkdir -p "$bin_dir"
    cat > "$bin_dir/.codex-config.$$" << 'CODEX_CONFIG_SCRIPT'
#!/usr/bin/env bash
codex-config() {
    local config_file="$HOME/.codex/config.toml"
    local editor
    read -r -a editor <<< "${EDITOR:-nano}"

    # Create directory if it doesn't exist
    mkdir -p "$(dirname "$config_file")"

    # Create empty config if it doesn't exist
    if [[ ! -f "$config_file" ]]; then
        echo "# Codex configuration" > "$config_file"
        echo "# See https://github.com/openai/codex for options" >> "$config_file"
    fi

    "${editor[@]}" "$config_file"
}
codex-config "$@"
CODEX_CONFIG_SCRIPT
    install_codex_script "$bin_dir/.codex-config.$$" "$bin_dir/codex-config"
    cat > "$bin_dir/.codex-policy.$$" << 'CODEX_POLICY_SCRIPT'
#!/usr/bin/env bash
codex-policy() {
    local policy_dir="$HOME/.codex/policy"
    local editor
    read -r -a editor <<< "${EDITOR:-nano}"

    # Create directory if it doesn't exist
    mkdir -p "$policy_dir"

    if [[ -n "$1" ]]; then
        # Edit specific policy file
        "${editor[@]}" "$policy_dir/$1"
    else
        # Show policy directory
        echo "Codex policy directory: $policy_dir"
        echo ""
        if command -v tree &> /dev/null; then
            tree "$policy_dir"
        else
            ls -la "$policy_dir"
        fi
        echo ""
        echo "Usage: codex-policy <filename>  # Edit a policy file"
        echo "Example: codex-policy default.codexpolicy"
    fi
}
codex-policy "$@"
CODEX_POLICY_SCRIPT
    install_codex_script "$bin_dir/.codex-policy.$$" "$bin_dir/codex-policy"
    case ":$PATH:" in *":$bin_dir:"*) ;; *) export PATH="$bin_dir:$PATH" ;; esac
}

setup_codex_helpers

# Point the Flox build of Codex at the Flox skills (colon-separated roots;
# any roots you set yourself are kept)
setup_codex_flox_skills() {
    local skills_dir="$FLOX_ENV/share/agent-plugins/flox/skills"
    [ -d "$skills_dir" ] || return 0
    case ":${CODEX_FLOX_SKILL_ROOTS:-}:" in
        *":$skills_dir:"*) ;;
        *) export CODEX_FLOX_SKILL_ROOTS="$skills_dir${CODEX_FLOX_SKILL_ROOTS:+:$CODEX_FLOX_SKILL_ROOTS}" ;;
    esac
}
setup_codex_flox_skills

# Remove the deprecated [mcp_servers.flox] table added to ~/.codex/config.toml
# by earlier versions of this environment
remove_codex_flox_mcp() {
    local config_file="$HOME/.codex/config.toml"
    local tmp
    grep -q '^\[mcp_servers\.flox\]' "$config_file" 2>/dev/null || return 0
    grep -q 'command = "flox-mcp"' "$config_file" || return 0
    tmp=$(mktemp)
    awk '
        /^\[/ { skip = ($0 == "[mcp_servers.flox]") }
        !skip
    ' "$config_file" > "$tmp" && cat "$tmp" > "$config_file"
    rm -f "$tmp"
    echo "Removed deprecated Flox MCP server from ~/.codex/config.toml (replaced by Flox skills)"
}

remove_codex_flox_mcp

echo ""
echo "Codex CLI - Local AI Coding Agent from OpenAI"
echo ""
echo "Codex is a lightweight coding agent that runs locally on your computer."
echo ""
echo "First-time setup:"
echo "  codex                       # Launch and sign in with ChatGPT account"
echo "                              # (Plus, Pro, Team, Edu, or Enterprise)"
echo ""
echo "Usage:"
echo "  codex                       # Interactive conversational mode"
echo "  codex exec <prompt>         # Non-interactive mode for scripting"
echo "  codex --help                # Show all options"
echo ""
echo "Configuration (optional):"
echo "  codex-config                # Edit ~/.codex/config.toml"
echo "  codex-policy                # Manage execution policies"
echo ""
echo "Flox skills:"
echo "  flox, floxify, and flox-debug skills are loaded automatically"
echo "  Ask Codex to create or floxify environments, add packages, or debug resolution"
echo ""
echo "Features:"
echo "  • Executes shell commands with approval system"
echo "  • Memory system via AGENTS.md files"
echo "  • Flox skills for managing Flox environments"
echo "  • Zero Data Retention option"
echo ""
'''


