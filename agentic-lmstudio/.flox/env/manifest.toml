schema-version = "1.11.0"

[install]
# LM Studio
lmstudio.pkg-path = "flox/lmstudio"
lmstudio.pkg-group = "lmstudio"

# general-purpose tools
bat.pkg-path = "bat"
bat.pkg-group = "tools"
bat.outputs = "all"
curl.pkg-path = "curl"
curl.pkg-group = "tools"
curl.outputs = "all"
jq.pkg-path = "jq"
jq.pkg-group = "tools"
jq.outputs = "all"
# lms-service runs under `#!/usr/bin/env bash` and needs bash 4.4 or newer;
# without this it gets macOS's /bin/bash 3.2 and fails
bash.pkg-path = "bashInteractive"
bash.pkg-group = "bash"
bash.systems = ["aarch64-darwin"]

# agentic cli tools
claude-code.pkg-path = "claude-code"
claude-code.pkg-group = "agentic"
claude-code.outputs = "all"
# Flox build of Codex (loads Flox skills from CODEX_FLOX_SKILL_ROOTS)
codex.pkg-path = "agent-stacks/codex"
codex.pkg-group = "codex"
opencode.pkg-path = "opencode"
opencode.pkg-group = "agentic"
opencode.outputs = "all"
#openclaw.pkg-path = "flox/openclaw"	# uncomment to use openclaw
#openclaw.pkg-group = "agentic"

# flox skills (flox, floxify, flox-debug) for the agentic cli tools
agent-plugin-flox.pkg-path = "agent-stacks/agent-plugin-flox"
agent-plugin-flox.pkg-group = "flox-skills"

[vars]
# Server configuration - override at activation time
# LMS_PORT           - API server port (default: 1234)
# LMS_HOST           - API server bind address (default: 127.0.0.1)
# LMS_GUI            - Launch GUI on activation: true/false (default: false)
# LMS_CORS           - Set to anything but 0 to allow cross-origin requests (default: off)
# LMS_CONTEXT_LENGTH - Default context window for lms-launch auto-load (default: 131072)

[hook]
on-activate = '''
# [profile] waits for the API and launches the GUI once per activation, not
# again each time another environment is layered on top
export AGENTIC_LMSTUDIO_PROFILE_PENDING=1

# Move a freshly written script into place, unless it matches the one there.
# The rename is atomic, so a command starting in another shell at the same
# moment never runs an empty or partly written script.
install_agentic_lmstudio_script() {
    local tmp="$1" dest="$2"
    if cmp -s "$tmp" "$dest"; then
        rm -f "$tmp"
    else
        chmod +x "$tmp"
        mv -f "$tmp" "$dest"
    fi
}

# helpf is a script rather than [profile] functions, so
# each is written once for every shell and also works in scripts, agents, and
# `flox activate -- <name>`. They read the environment when they run.
# A script is moved into place only when it changed
install_agentic_lmstudio_script() {
    local tmp="$1" dest="$2"
    if cmp -s "$tmp" "$dest"; then
        rm -f "$tmp"
    else
        chmod +x "$tmp"
        mv -f "$tmp" "$dest"
    fi
}

setup_agentic_lmstudio_helpers() {
    local bin_dir="$FLOX_ENV_CACHE/bin"
    mkdir -p "$bin_dir"
    { echo '#!/usr/bin/env bash'
      printf 'FLOX_ENV=%q FLOX_ENV_CACHE=%q FLOX_ENV_PROJECT=%q\n' "$FLOX_ENV" "$FLOX_ENV_CACHE" "$FLOX_ENV_PROJECT"
      cat << 'HELPF_SCRIPT'
helpf() {
    local README_FILE="$FLOX_ENV_PROJECT/README.md"

    if [ "$1" = "--help" ]; then
        echo "Usage: helpf"
        echo ""
        echo "View this environment's README"
        return 0
    fi

    if [ -f "$README_FILE" ]; then
        bat --style=auto --paging=always "$README_FILE"
    else
        echo "README.md not found at $README_FILE"
        echo "See https://github.com/flox/agentic-development-with-flox/tree/main/agentic-lmstudio"
        return 1
    fi
}
helpf "$@"
HELPF_SCRIPT
    } > "$bin_dir/.helpf.$$"
    install_agentic_lmstudio_script "$bin_dir/.helpf.$$" "$bin_dir/helpf"
    case ":$PATH:" in *":$bin_dir:"*) ;; *) export PATH="$bin_dir:$PATH" ;; esac
}

setup_agentic_lmstudio_helpers

# === SERVER CONFIGURATION ===
export LMS_PORT="${LMS_PORT:-1234}"
export LMS_HOST="${LMS_HOST:-127.0.0.1}"
export LMS_GUI="${LMS_GUI:-false}"
export LMS_CONTEXT_LENGTH="${LMS_CONTEXT_LENGTH:-131072}"

# Constructed base URL for helper functions
export LMS_API_BASE="http://${LMS_HOST}:${LMS_PORT}"

# === DATA DIRECTORIES ===
export LMS_LOG_DIR="$FLOX_ENV_CACHE/logs"
mkdir -p "$LMS_LOG_DIR"

# === GPU DETECTION ===
export _FLOX_ENV_CUDA_DETECTION=0
if command -v nvidia-smi >/dev/null 2>&1; then
  if nvidia-smi -L 2>/dev/null | grep -q "GPU"; then
    export _FLOX_ENV_CUDA_DETECTION=1
  fi
fi

# === FLOX SKILLS ===
# Load the Flox skills (flox, floxify, flox-debug) into the agentic CLI tools.
# Applies to direct launches and to the launcher's tool sessions alike.
setup_claude_flox_skills() {
    local skills_dir="$FLOX_ENV/share/agent-plugins/flox/skills"
    local plugin_dir="$FLOX_ENV_CACHE/claude-plugin/flox"
    local real_claude="$FLOX_ENV/bin/claude"
    local shim_dir="$FLOX_ENV_CACHE/bin"
    export AGENTIC_LMSTUDIO_SHIM_DIR="$shim_dir"
    [ -n "$FLOX_ENV_CACHE" ] && [ -d "$skills_dir" ] && [ -x "$real_claude" ] || return 0

    # agent-plugin-flox ships its skills without a Claude Code plugin
    # manifest, so build a plugin directory that links to them
    mkdir -p "$plugin_dir/.claude-plugin"
    local version
    version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' "$FLOX_ENV/share/agent-plugins/flox/plugin.json" 2>/dev/null)
    printf '{"name":"flox","version":"%s","description":"Flox skills (flox, floxify, flox-debug) from agent-stacks/agent-plugin-flox","author":{"name":"Flox"},"license":"Apache-2.0"}\n' \
        "${version:-0.0.0}" > "$plugin_dir/.claude-plugin/plugin.json.$$"
    mv -f "$plugin_dir/.claude-plugin/plugin.json.$$" "$plugin_dir/.claude-plugin/plugin.json"
    ln -sfn "$skills_dir" "$plugin_dir/skills"

    # PATH shim adds --plugin-dir unless flox@flox-skills is installed and enabled globally
    mkdir -p "$shim_dir"
    cat > "$shim_dir/.claude.$$" << EOF
#!/usr/bin/env bash
if grep -qs '"flox@flox-skills"' "\$HOME/.claude/plugins/installed_plugins.json" && grep -Eqs '"flox@flox-skills"[[:space:]]*:[[:space:]]*true' "\$HOME/.claude/settings.json"; then
    exec "$real_claude" "\$@"
fi
exec "$real_claude" --plugin-dir "$plugin_dir" "\$@"
EOF
    install_agentic_lmstudio_script "$shim_dir/.claude.$$" "$shim_dir/claude"
    case ":$PATH:" in
        *":$shim_dir:"*) ;;
        *) export PATH="$shim_dir:$PATH" ;;
    esac
}
setup_claude_flox_skills

# The Flox build of Codex reads skills from CODEX_FLOX_SKILL_ROOTS
# (colon-separated; any roots you set yourself are kept)
setup_codex_flox_skills() {
    local skills_dir="$FLOX_ENV/share/agent-plugins/flox/skills"
    [ -d "$skills_dir" ] || return 0
    case ":${CODEX_FLOX_SKILL_ROOTS:-}:" in
        *":$skills_dir:"*) ;;
        *) export CODEX_FLOX_SKILL_ROOTS="$skills_dir${CODEX_FLOX_SKILL_ROOTS:+:$CODEX_FLOX_SKILL_ROOTS}" ;;
    esac
}
setup_codex_flox_skills

# OpenCode merges the file named by OPENCODE_CONFIG with its other config, and
# launchers that set OPENCODE_CONFIG_CONTENT (e.g. newer `ollama launch`) don't
# override it. Falls back to OPENCODE_CONFIG_CONTENT if OPENCODE_CONFIG is taken.
setup_opencode_flox_skills() {
    local skills_dir="$FLOX_ENV/share/agent-plugins/flox/skills"
    local config="$FLOX_ENV_CACHE/opencode-flox-skills.json"
    local content="{\"skills\":{\"paths\":[\"$skills_dir\"]}}"
    [ -d "$skills_dir" ] || return 0
    if [ -z "${OPENCODE_CONFIG:-}" ] || [ "$OPENCODE_CONFIG" = "$config" ]; then
        printf '%s\n' "$content" > "$config"
        export OPENCODE_CONFIG="$config"
    elif [ -z "${OPENCODE_CONFIG_CONTENT:-}" ]; then
        export OPENCODE_CONFIG_CONTENT="$content"
    else
        echo "Note: OPENCODE_CONFIG and OPENCODE_CONFIG_CONTENT are both set; Flox skills not added to OpenCode" >&2
    fi
}
setup_opencode_flox_skills

# === DISPLAY CONFIGURATION ===
echo ""
echo "LM Studio + Agentic Tools environment ready"
echo ""
echo "Server:"
echo "  API: ${LMS_API_BASE}"
echo "  GUI: ${LMS_GUI}"
if [ "$_FLOX_ENV_CUDA_DETECTION" = "1" ]; then
  echo "  GPU: Available (CUDA detected)"
else
  echo "  GPU: Not detected (CPU mode)"
fi
echo ""
echo "Quick Start:"
echo "  flox activate -s                                  Start LM Studio server"
echo "  lms-launch claude --model zai-org/glm-4.7-flash   Download, load, launch"
echo ""
echo "  Context window: ${LMS_CONTEXT_LENGTH} (override: --context-length or LMS_CONTEXT_LENGTH)"
if [ "$_FLOX_ENV_CUDA_DETECTION" = "1" ]; then
  echo "  GPU: auto-detected (override: --gpu max|off)"
else
  echo "  GPU: not detected (override: --gpu max|off)"
fi
echo ""
echo "Commands:"
echo "  lms-launch <tool> --model <m> [args]      Download, load, and launch tool"
echo "  lms ps                                    List loaded models"
echo "  lmstudio-info                             Show configuration"
echo "  lmstudio-health                           Test API endpoint"
echo "  helpf                                     View full README documentation"
echo ""

'''

[services.lm-studio]
command = "lms-service"
is-daemon = false

[profile]
bash = '''
# Layering another environment on top puts its bin directories ahead of
# this environment's shims; move them back to the front
if [ -n "$AGENTIC_LMSTUDIO_SHIM_DIR" ] && [ -x "$AGENTIC_LMSTUDIO_SHIM_DIR/claude" ]; then
    case ":$PATH:" in
        ":$AGENTIC_LMSTUDIO_SHIM_DIR:"*) ;;
        *)
            # Drop the copy further down, so PATH doesn't grow each time
            agentic_lmstudio_path=":$PATH:"
            while [ "${agentic_lmstudio_path#*:"$AGENTIC_LMSTUDIO_SHIM_DIR":}" != "$agentic_lmstudio_path" ]; do
                agentic_lmstudio_path="${agentic_lmstudio_path%%:"$AGENTIC_LMSTUDIO_SHIM_DIR":*}:${agentic_lmstudio_path#*:"$AGENTIC_LMSTUDIO_SHIM_DIR":}"
            done
            agentic_lmstudio_path="${agentic_lmstudio_path#:}"
            PATH="$AGENTIC_LMSTUDIO_SHIM_DIR${agentic_lmstudio_path:+:${agentic_lmstudio_path%:}}"
            unset agentic_lmstudio_path
            ;;
    esac
fi

# Once per activation: wait for the API, launch the GUI
if [ "${AGENTIC_LMSTUDIO_PROFILE_PENDING:-}" = "1" ]; then
    export AGENTIC_LMSTUDIO_PROFILE_PENDING=0
    # Wait for API server if services are starting
    if [ "${FLOX_ACTIVATE_START_SERVICES:-}" = "true" ]; then
      printf "Waiting for LM Studio API"
      _lms_ready=false
      for _i in $(seq 1 30); do
        if curl -sf "http://${LMS_HOST}:${LMS_PORT}/v1/models" >/dev/null 2>&1; then
          _lms_ready=true
          break
        fi
        printf "."
        sleep 2
      done
      if [ "$_lms_ready" = "true" ]; then
        echo " ready!"
      else
        echo " not responding (check: flox services logs lm-studio)"
      fi
    fi


    # Optionally launch GUI on activation
    if [ "${LMS_GUI}" = "true" ]; then
        lm-studio &
    fi
fi
'''

zsh = '''
# Layering another environment on top puts its bin directories ahead of
# this environment's shims; move them back to the front
if [ -n "$AGENTIC_LMSTUDIO_SHIM_DIR" ] && [ -x "$AGENTIC_LMSTUDIO_SHIM_DIR/claude" ]; then
    case ":$PATH:" in
        ":$AGENTIC_LMSTUDIO_SHIM_DIR:"*) ;;
        *)
            # Drop the copy further down, so PATH doesn't grow each time
            agentic_lmstudio_path=":$PATH:"
            while [ "${agentic_lmstudio_path#*:"$AGENTIC_LMSTUDIO_SHIM_DIR":}" != "$agentic_lmstudio_path" ]; do
                agentic_lmstudio_path="${agentic_lmstudio_path%%:"$AGENTIC_LMSTUDIO_SHIM_DIR":*}:${agentic_lmstudio_path#*:"$AGENTIC_LMSTUDIO_SHIM_DIR":}"
            done
            agentic_lmstudio_path="${agentic_lmstudio_path#:}"
            PATH="$AGENTIC_LMSTUDIO_SHIM_DIR${agentic_lmstudio_path:+:${agentic_lmstudio_path%:}}"
            unset agentic_lmstudio_path
            ;;
    esac
fi

# Once per activation: wait for the API, launch the GUI
if [ "${AGENTIC_LMSTUDIO_PROFILE_PENDING:-}" = "1" ]; then
    export AGENTIC_LMSTUDIO_PROFILE_PENDING=0
    # Wait for API server if services are starting
    if [ "${FLOX_ACTIVATE_START_SERVICES:-}" = "true" ]; then
      printf "Waiting for LM Studio API"
      _lms_ready=false
      for _i in $(seq 1 30); do
        if curl -sf "http://${LMS_HOST}:${LMS_PORT}/v1/models" >/dev/null 2>&1; then
          _lms_ready=true
          break
        fi
        printf "."
        sleep 2
      done
      if [ "$_lms_ready" = "true" ]; then
        echo " ready!"
      else
        echo " not responding (check: flox services logs lm-studio)"
      fi
    fi


    # Optionally launch GUI on activation
    if [ "${LMS_GUI}" = "true" ]; then
        lm-studio &
    fi
fi
'''

fish = '''
# Layering another environment on top puts its bin directories ahead of
# this environment's shims; move them back to the front
if set -q AGENTIC_LMSTUDIO_SHIM_DIR; and test -x "$AGENTIC_LMSTUDIO_SHIM_DIR/claude"
    set -gx PATH $AGENTIC_LMSTUDIO_SHIM_DIR (string match -v -- $AGENTIC_LMSTUDIO_SHIM_DIR $PATH)
end

# Once per activation: wait for the API, launch the GUI
if test "$AGENTIC_LMSTUDIO_PROFILE_PENDING" = "1"
    set -gx AGENTIC_LMSTUDIO_PROFILE_PENDING 0
    # Wait for API server if services are starting
    if test "$FLOX_ACTIVATE_START_SERVICES" = "true"
      printf "Waiting for LM Studio API"
      set _lms_ready false
      for _i in (seq 1 30)
        if curl -sf "http://$LMS_HOST:$LMS_PORT/v1/models" >/dev/null 2>&1
          set _lms_ready true
          break
        end
        printf "."
        sleep 2
      end
      if test "$_lms_ready" = "true"
        echo " ready!"
      else
        echo " not responding (check: flox services logs lm-studio)"
      end
    end


    # Optionally launch GUI on activation
    if test "$LMS_GUI" = "true"
        lm-studio &
    end
end
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
