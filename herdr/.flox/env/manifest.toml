schema-version = "1.11.0"

[install]
# The Flox build points Herdr's background version check at 127.0.0.1, and
# Herdr turns off `herdr update` for Nix installs; upgrade with `flox upgrade`.
herdr.pkg-path = "agent-stacks/herdr"
herdr.pkg-group = "herdr"
# The agent integrations (`herdr integration install claude`, ...) are hook
# scripts that need python3; without it they exit silently and do nothing
python3.pkg-path = "python3"
python3.pkg-group = "herdr-tools"

git.pkg-path = "gitFull"
git.outputs = "all"
curl.pkg-path = "curl"
bat.pkg-path = "bat"

[hook]
on-activate = '''
# herdr-info is a script rather than a [profile] function, so it's written once
# for every shell and also works in scripts, agents, and
# `flox activate -- herdr-info`. It reads the environment when it runs.
# A script is moved into place only when it changed
install_herdr_script() {
    local tmp="$1" dest="$2"
    if cmp -s "$tmp" "$dest"; then
        rm -f "$tmp"
    else
        chmod +x "$tmp"
        mv -f "$tmp" "$dest"
    fi
}

setup_herdr_info() {
    local bin_dir="$FLOX_ENV_CACHE/bin"
    mkdir -p "$bin_dir"
    cat > "$bin_dir/.herdr-info.$$" << 'HERDR_INFO'
#!/usr/bin/env bash
herdr_info() {
    echo "Herdr Environment Configuration"
    echo ""
    echo "Version: $(herdr --version 2>/dev/null | sed 's/^herdr //')"
    if herdr status server 2>/dev/null | grep -q 'status: running'; then
        echo "Server: running"
    else
        echo "Server: not running (herdr starts it)"
    fi
    # Herdr reads a set-but-empty XDG directory as the current directory
    local herdr_dir="${XDG_CONFIG_HOME-$HOME/.config}" herdr_state="${XDG_STATE_HOME-$HOME/.local/state}"
    herdr_dir="${herdr_dir:-.}/herdr" herdr_state="${herdr_state:-.}/herdr"
    echo "Config: ${HERDR_CONFIG_PATH:-$herdr_dir/config.toml}"
    echo "Logs and session state: $herdr_dir"
    echo "Agent detection state: $herdr_state"
    echo ""
    echo "Commands:"
    echo "  herdr                            Launch or attach to the session"
    echo "  herdr session attach <name>      Use a separate named session"
    echo "  prefix (ctrl+b), then q          Detach; everything keeps running"
    echo "  prefix (ctrl+b), then ?          Show every key binding"
    echo "  herdr integration install <agent>  Agent state and session restore"
    echo "  herdr integration status         Show installed integrations"
    echo "  herdr agent list                 Agents Herdr sees, and their state"
    echo "  herdr --default-config           Print every setting with its default"
    echo "  herdr --skill                    Skill that teaches agents to drive Herdr"
    echo "  herdr server stop                Stop the server and every pane"
    echo ""
    echo "Docs: https://herdr.dev/docs/"
    echo "Source: https://github.com/herdrdev/herdr"
}
herdr_info "$@"
HERDR_INFO
    install_herdr_script "$bin_dir/.herdr-info.$$" "$bin_dir/herdr-info"
    case ":$PATH:" in *":$bin_dir:"*) ;; *) export PATH="$bin_dir:$PATH" ;; esac
}

setup_herdr_info

# List the coding agents Herdr can run and track from this shell
show_herdr_agents() {
    local agent found=""
    for agent in claude codex gemini opencode pi hermes amp copilot droid qwen kilo; do
        command -v "$agent" >/dev/null 2>&1 && found="$found $agent"
    done
    if [ -n "$found" ]; then
        echo "  Agents on PATH:$found"
    else
        echo "  Agents on PATH: none found"
        echo "  Activate an agent environment first (e.g. ../claude-code),"
        echo "  then this one, or install an agent another way."
    fi
}

# Panes get the environment of the shell that started the Herdr server, so a
# server started elsewhere doesn't see this environment's tools
show_herdr_server_state() {
    if herdr status server 2>/dev/null | grep -q 'status: running'; then
        echo "  Server: already running; new panes use the environment it was"
        echo "  started in (herdr server stop, then herdr, to start it here)"
    fi
}

# === DISPLAY CONFIGURATION ===
echo ""
echo "Herdr environment ready"
echo ""
show_herdr_agents
show_herdr_server_state
echo "  Panes keep running after you detach or exit; herdr server stop ends them."
echo ""

echo "Commands:"
echo "  herdr                            Launch or attach to the session"
echo "  herdr integration install claude Agent state and session restore"
echo "                                   (also: codex, pi, opencode, ...)"
echo "  herdr agent list                 Agents Herdr sees, and their state"
echo "  herdr server stop                Stop the server and every pane"
echo "  herdr-info                       Show configuration"
echo ""
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
