fish = '''
if set -q FLOXENV_TOAD_VENV; and set -q FLOXENV_TOAD_SHIM_DIR
    set -gx VIRTUAL_ENV $FLOXENV_TOAD_VENV
    # Layering another environment on top puts its bin directories ahead of
    # the venv and the wrapper; move them back to the front
    set -gx PATH $FLOXENV_TOAD_VENV/bin (string match -v -- $FLOXENV_TOAD_VENV/bin $PATH)
    # The toad wrapper (unsets PYTHONPATH) goes ahead of the venv's toad
    set -gx PATH $FLOXENV_TOAD_SHIM_DIR (string match -v -- $FLOXENV_TOAD_SHIM_DIR $PATH)
end
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
