schema-version = "1.11.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
antigravity-cli.pkg-path = "agent-stacks/antigravity-cli"
antigravity-cli.pkg-group = "antigravity-cli"

# Flox skills (flox, floxify, flox-debug) - teach Antigravity CLI to manage Flox environments
agent-plugin-flox.pkg-path = "agent-stacks/agent-plugin-flox"
agent-plugin-flox.pkg-group = "flox-skills"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]


## Activation Hook ---------------------------------------------------
[hook]
on-activate = '''
# agy is installed read-only by Flox, so its self-updater can't replace it;
# update by upgrading the environment instead (flox upgrade)
export AGY_CLI_DISABLE_AUTO_UPDATE="${AGY_CLI_DISABLE_AUTO_UPDATE:-1}"

# Link the Flox skills into ~/.gemini/config/skills (Antigravity CLI has no
# environment-scoped skill path). Links that point at a Flox skills package are
# refreshed on each activation; skills you added yourself (directories, or
# symlinks pointing anywhere else) are never replaced.
link_antigravity_flox_skills() {
    local skills_src="$FLOX_ENV/share/agent-plugins/flox/skills"
    local skills_dst="$HOME/.gemini/config/skills"
    local skill name target
    [ -d "$skills_src" ] || return 0
    mkdir -p "$skills_dst"
    for skill in "$skills_src"/*/; do
        name=$(basename "$skill")
        target="$skills_dst/$name"
        if [ -L "$target" ]; then
            case "$(readlink "$target")" in
                */share/agent-plugins/flox/skills/"$name") ;;
                *) continue ;;
            esac
        elif [ -e "$target" ]; then
            continue
        fi
        ln -sfn "$skills_src/$name" "$target"
    done
}

link_antigravity_flox_skills

echo ""
echo "Antigravity CLI - Google's Terminal Coding Agent"
echo ""
echo "The successor to Gemini CLI: Gemini and Claude models in your terminal."
echo ""
echo "First-time setup:"
echo "  agy                         # Launch and sign in with your Google account"
echo "  GEMINI_API_KEY=... agy      # Or use a Gemini API key"
echo ""
echo "Usage:"
echo "  agy                         # Interactive mode"
echo "  agy -p \"prompt\"             # Non-interactive mode"
echo "  agy -p \"...\" --output-format json   # JSON output for scripting"
echo "  agy --mode plan             # Plan before editing (also: accept-edits, auto)"
echo "  agy -c                      # Continue the most recent conversation"
echo "  agy models                  # List available models"
echo ""
echo "Flox skills:"
echo "  flox, floxify, and flox-debug linked into ~/.gemini/config/skills"
echo ""
echo "Coming from Gemini CLI? 'agy plugin import gemini' imports your extensions"
echo ""
'''


