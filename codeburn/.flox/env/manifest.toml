schema-version = "1.11.0"

[install]
codeburn.pkg-path = "flox/codeburn"
codeburn.pkg-group = "codeburn"

git.pkg-path = "gitFull"
git.outputs = "all"
curl.pkg-path = "curl"
bat.pkg-path = "bat"

[hook]
on-activate = '''
# codeburn-info is a script rather than a [profile] function, so it's written once
# for every shell and also works in scripts, agents, and
# `flox activate -- codeburn-info`. It reads the environment when it runs.
# A script is moved into place only when it changed
install_codeburn_script() {
    local tmp="$1" dest="$2"
    if cmp -s "$tmp" "$dest"; then
        rm -f "$tmp"
    else
        chmod +x "$tmp"
        mv -f "$tmp" "$dest"
    fi
}

setup_codeburn_info() {
    local bin_dir="$FLOX_ENV_CACHE/bin"
    mkdir -p "$bin_dir"
    cat > "$bin_dir/.codeburn-info.$$" << 'CODEBURN_INFO'
#!/usr/bin/env bash
echo "CodeBurn Environment Configuration"
echo ""
echo "Cache:  ${CODEBURN_CACHE_DIR:-$HOME/.cache/codeburn}"
echo "Config: $HOME/.config/codeburn/config.json (currency, plans, price overrides)"
echo "Claude Code profiles: ${CLAUDE_CONFIG_DIRS:-${CLAUDE_CONFIG_DIR:-$HOME/.claude (default)}}"
echo ""
echo "Commands:"
echo "  codeburn                     Interactive dashboard"
echo "  codeburn status              One-line summary: today and this month"
echo "  codeburn today | month       Dashboard for today or this month"
echo "  codeburn report -p 30days    Dashboard for another period (--format json)"
echo "  codeburn models              Per-model token and cost table"
echo "  codeburn sessions            Per-session usage report"
echo "  codeburn optimize            Find token waste, with suggested fixes"
echo "  codeburn compare             Compare two models side by side"
echo "  codeburn export -f json      Export usage to CSV or JSON"
echo "  codeburn web                 Local web dashboard (127.0.0.1:4747)"
echo "  codeburn doctor              Which agents were found, and where"
echo "  codeburn mcp                 MCP server (stdio) with usage tools"
echo ""
echo "Filter any report with --provider <name>, e.g. --provider claude"
echo "Source: https://github.com/getagentseal/codeburn"
CODEBURN_INFO
    install_codeburn_script "$bin_dir/.codeburn-info.$$" "$bin_dir/codeburn-info"
    case ":$PATH:" in *":$bin_dir:"*) ;; *) export PATH="$bin_dir:$PATH" ;; esac
}

setup_codeburn_info

# CodeBurn reads the session logs that coding agents already write to disk
# (Claude Code, Codex, Gemini CLI, OpenCode, pi, and 40-odd more); there is
# nothing to configure and no account. It keeps a parse cache and LiteLLM's
# model price list (refreshed daily, with a built-in fallback when offline)
# in ~/.cache/codeburn, or $CODEBURN_CACHE_DIR.
#
# To merge several Claude Code profiles, pass CLAUDE_CONFIG_DIRS at
# activation so your shell expands the paths (not every part of CodeBurn
# expands ~):
#   CLAUDE_CONFIG_DIRS="$HOME/.claude-work:$HOME/.claude-personal" flox activate

# === DISPLAY CONFIGURATION ===
echo ""
echo "CodeBurn environment ready"
echo ""
echo "  Reads local session logs from your coding agents; no account or API key."
if [ -n "$CLAUDE_CONFIG_DIRS" ]; then
  echo "  Claude Code profiles: $CLAUDE_CONFIG_DIRS"
fi
echo ""

echo "Commands:"
echo "  codeburn                     Interactive dashboard"
echo "  codeburn status              One-line summary: today and this month"
echo "  codeburn today | month       Dashboard for today or this month"
echo "  codeburn models              Per-model token and cost table"
echo "  codeburn optimize            Find token waste, with suggested fixes"
echo "  codeburn web                 Local web dashboard (127.0.0.1:4747)"
echo "  codeburn doctor              Which agents were found, and where"
echo "  codeburn-info                Show configuration"
echo ""
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
