schema-version = "1.11.0"

[install]
# ollama for linux and/or cuda
ollama-cuda.pkg-path = "flox/ollama-cuda"
ollama-cuda.systems = ["x86_64-linux", "aarch64-linux"]
ollama-cuda.priority = 1
ollama-cuda.pkg-group = "cuda"

# ollama for darwin
ollama.pkg-path = "ollama"
ollama.systems = ["aarch64-darwin"]
ollama.priority = 1

# general-purpose tools
bat.pkg-path = "bat"
bat.pkg-group = "tools"
curl.pkg-path = "curl"
curl.pkg-group = "tools"
curl.outputs = "all"

# agentic cli tools
claude-code.pkg-path = "claude-code"
claude-code.pkg-group = "agentic"
claude-code.outputs = "all"
# Flox build of Codex (loads Flox skills from CODEX_FLOX_SKILL_ROOTS)
codex.pkg-path = "flox/codex"
codex.pkg-group = "codex"
opencode.pkg-path = "opencode"
opencode.pkg-group = "agentic"
opencode.outputs = "all"
#openclaw.flake = "github:barstoolbluz/openclaw-nix"	# uncomment to use openclaw

# flox skills (flox, floxify, flox-debug) for the agentic cli tools
agent-plugin-flox.pkg-path = "agent-stacks/agent-plugin-flox"
agent-plugin-flox.pkg-group = "flox-skills"

[vars]
# Model storage - defaults to Ollama's standard location
# Users can override with: OLLAMA_MODELS=/custom/path flox activate
# Or use local cache with: OLLAMA_MODELS=$FLOX_ENV_CACHE/models flox activate

[hook]
on-activate = '''
# Move a freshly written script into place, unless it matches the one there.
# The rename is atomic, so a command starting in another shell at the same
# moment never runs an empty or partly written script.
install_agentic_ollama_script() {
    local tmp="$1" dest="$2"
    if cmp -s "$tmp" "$dest"; then
        rm -f "$tmp"
    else
        chmod +x "$tmp"
        mv -f "$tmp" "$dest"
    fi
}

# ollama-info, ollama-health, helpf are scripts rather than [profile] functions, so
# each is written once for every shell and also works in scripts, agents, and
# `flox activate -- <name>`. They read the environment when they run.
# A script is moved into place only when it changed
install_agentic_ollama_script() {
    local tmp="$1" dest="$2"
    if cmp -s "$tmp" "$dest"; then
        rm -f "$tmp"
    else
        chmod +x "$tmp"
        mv -f "$tmp" "$dest"
    fi
}

setup_agentic_ollama_helpers() {
    local bin_dir="$FLOX_ENV_CACHE/bin"
    mkdir -p "$bin_dir"
    { echo '#!/usr/bin/env bash'
      printf 'FLOX_ENV=%q FLOX_ENV_CACHE=%q FLOX_ENV_PROJECT=%q\n' "$FLOX_ENV" "$FLOX_ENV_CACHE" "$FLOX_ENV_PROJECT"
      cat << 'OLLAMA_INFO_SCRIPT'
ollama-info() {
    echo "Ollama Headless Environment Configuration"
    echo ""
    echo "Server:"
    echo "  Host: ${OLLAMA_HOST}"
    echo "  Models: ${OLLAMA_MODELS}"
    echo ""
    echo "Performance:"
    if [ -n "$OLLAMA_CONTEXT_LENGTH" ]; then
        echo "  Context Length: ${OLLAMA_CONTEXT_LENGTH}"
    else
        echo "  Context Length: 4096 (default)"
    fi
    if [ -n "$OLLAMA_KEEP_ALIVE" ]; then
        echo "  Keep Alive: ${OLLAMA_KEEP_ALIVE}"
    else
        echo "  Keep Alive: 5m (default)"
    fi
    if [ -n "$OLLAMA_NUM_PARALLEL" ]; then
        echo "  Num Parallel: ${OLLAMA_NUM_PARALLEL}"
    else
        echo "  Num Parallel: 1 (default)"
    fi
    if [ -n "$OLLAMA_MAX_QUEUE" ]; then
        echo "  Max Queue: ${OLLAMA_MAX_QUEUE}"
    else
        echo "  Max Queue: 512 (default)"
    fi
    if [ -n "$OLLAMA_MAX_LOADED_MODELS" ]; then
        echo "  Max Loaded Models: ${OLLAMA_MAX_LOADED_MODELS}"
    else
        echo "  Max Loaded Models: auto (default)"
    fi
    echo ""
    echo "GPU:"
    if [ -n "$OLLAMA_FLASH_ATTENTION" ]; then
        echo "  Flash Attention: enabled"
    else
        echo "  Flash Attention: disabled (default)"
    fi
    if [ -n "$OLLAMA_KV_CACHE_TYPE" ]; then
        echo "  KV Cache Type: ${OLLAMA_KV_CACHE_TYPE}"
    else
        echo "  KV Cache Type: f16 (default)"
    fi
    if [ -n "$CUDA_VISIBLE_DEVICES" ]; then
        echo "  CUDA Devices: ${CUDA_VISIBLE_DEVICES}"
    else
        echo "  CUDA Devices: all (default)"
    fi
    echo ""
    if [ "$OLLAMA_DEBUG" = "1" ]; then
        echo "Debug: enabled"
    else
        echo "Debug: disabled"
    fi
    echo ""
    echo "Commands:"
    echo "  ollama pull <model>       Download a model"
    echo "  ollama list               List local models"
    echo "  ollama ps                 List running models"
    echo "  flox services status      Check service status"
    echo "  flox services logs ollama View Ollama logs"
    echo "  ollama-health             Test API endpoint"
    echo ""
    echo "Runtime Override Examples:"
    echo "  OLLAMA_HOST=0.0.0.0:11434 flox activate -s"
    echo "  OLLAMA_NUM_PARALLEL=4 flox activate -s"
    echo "  OLLAMA_DEBUG=1 flox activate -s"
}
ollama-info "$@"
OLLAMA_INFO_SCRIPT
    } > "$bin_dir/.ollama-info.$$"
    install_agentic_ollama_script "$bin_dir/.ollama-info.$$" "$bin_dir/ollama-info"
    { echo '#!/usr/bin/env bash'
      printf 'FLOX_ENV=%q FLOX_ENV_CACHE=%q FLOX_ENV_PROJECT=%q\n' "$FLOX_ENV" "$FLOX_ENV_CACHE" "$FLOX_ENV_PROJECT"
      cat << 'OLLAMA_HEALTH_SCRIPT'
ollama-health() {
    local HOST="${OLLAMA_HOST:-127.0.0.1:11434}"
    # Remove http:// or https:// prefix if present
    HOST="${HOST#http://}"
    HOST="${HOST#https://}"

    if curl -s "http://${HOST}/" | grep -q "Ollama is running"; then
        echo "Ollama API is healthy at http://${HOST}"
        return 0
    else
        echo "Ollama API is not responding at http://${HOST}"
        echo "   Try: flox services status"
        return 1
    fi
}
ollama-health "$@"
OLLAMA_HEALTH_SCRIPT
    } > "$bin_dir/.ollama-health.$$"
    install_agentic_ollama_script "$bin_dir/.ollama-health.$$" "$bin_dir/ollama-health"
    { echo '#!/usr/bin/env bash'
      printf 'FLOX_ENV=%q FLOX_ENV_CACHE=%q FLOX_ENV_PROJECT=%q\n' "$FLOX_ENV" "$FLOX_ENV_CACHE" "$FLOX_ENV_PROJECT"
      cat << 'HELPF_SCRIPT'
helpf() {
    local README_FILE="$FLOX_ENV_PROJECT/README.md"

    if [ "$1" = "--help" ]; then
        echo "Usage: helpf"
        echo ""
        echo "View this environment's README"
        return 0
    fi

    if [ -f "$README_FILE" ]; then
        bat --style=auto --paging=always "$README_FILE"
    else
        echo "README.md not found at $README_FILE"
        echo "See https://github.com/flox/agentic-development-with-flox/tree/main/agentic-ollama"
        return 1
    fi
}
helpf "$@"
HELPF_SCRIPT
    } > "$bin_dir/.helpf.$$"
    install_agentic_ollama_script "$bin_dir/.helpf.$$" "$bin_dir/helpf"
    case ":$PATH:" in *":$bin_dir:"*) ;; *) export PATH="$bin_dir:$PATH" ;; esac
}

setup_agentic_ollama_helpers

# === MODEL STORAGE ===
# Use Ollama's default location (~/.ollama/models) unless user overrides
# To use project-local storage: OLLAMA_MODELS=$FLOX_ENV_CACHE/models flox activate
export OLLAMA_MODELS="${OLLAMA_MODELS:-$HOME/.ollama/models}"

# Create models directory if using custom location
if [ "$OLLAMA_MODELS" = "$FLOX_ENV_CACHE/models" ]; then
  mkdir -p "$OLLAMA_MODELS"
fi

# === SERVER CONFIGURATION ===
export OLLAMA_HOST="${OLLAMA_HOST:-127.0.0.1:11434}"
export OLLAMA_ORIGINS="${OLLAMA_ORIGINS:-}"  # Use Ollama defaults

# === PERFORMANCE & MEMORY ===
export OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-}"  # Default: 4096
export OLLAMA_KEEP_ALIVE="${OLLAMA_KEEP_ALIVE:-}"  # Default: 5m
export OLLAMA_MAX_LOADED_MODELS="${OLLAMA_MAX_LOADED_MODELS:-}"  # Default: auto (3 * GPU count)
export OLLAMA_NUM_PARALLEL="${OLLAMA_NUM_PARALLEL:-}"  # Default: 1
export OLLAMA_MAX_QUEUE="${OLLAMA_MAX_QUEUE:-}"  # Default: 512
export OLLAMA_LOAD_TIMEOUT="${OLLAMA_LOAD_TIMEOUT:-}"  # Default: 5m

# === GPU CONFIGURATION ===
export OLLAMA_FLASH_ATTENTION="${OLLAMA_FLASH_ATTENTION:-}"  # Experimental
export OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-}"  # Default: f16
export OLLAMA_GPU_OVERHEAD="${OLLAMA_GPU_OVERHEAD:-}"  # Default: 0
# Only set CUDA_VISIBLE_DEVICES if user explicitly provides it
if [ -n "${CUDA_VISIBLE_DEVICES+x}" ]; then
  export CUDA_VISIBLE_DEVICES
fi

# Detect GPU availability
export _FLOX_ENV_CUDA_DETECTION=0
if command -v nvidia-smi >/dev/null 2>&1; then
  if nvidia-smi -L 2>/dev/null | grep -q "GPU"; then
    export _FLOX_ENV_CUDA_DETECTION=1
  fi
fi

# === ADVANCED / EXPERIMENTAL ===
export OLLAMA_DEBUG="${OLLAMA_DEBUG:-0}"  # 0 = disabled, 1 = enabled
export OLLAMA_SCHED_SPREAD="${OLLAMA_SCHED_SPREAD:-}"  # Schedule across all GPUs
export OLLAMA_NOPRUNE="${OLLAMA_NOPRUNE:-}"  # Don't prune model blobs
export OLLAMA_LLM_LIBRARY="${OLLAMA_LLM_LIBRARY:-}"  # Bypass autodetection
export OLLAMA_AUTH="${OLLAMA_AUTH:-}"  # Experimental authentication

# === FLOX SKILLS ===
# Load the Flox skills (flox, floxify, flox-debug) into the agentic CLI tools.
# Applies to direct launches and to the launcher's tool sessions alike.
setup_claude_flox_skills() {
    local skills_dir="$FLOX_ENV/share/agent-plugins/flox/skills"
    local plugin_dir="$FLOX_ENV_CACHE/claude-plugin/flox"
    local real_claude="$FLOX_ENV/bin/claude"
    local shim_dir="$FLOX_ENV_CACHE/bin"
    export AGENTIC_OLLAMA_SHIM_DIR="$shim_dir"
    [ -n "$FLOX_ENV_CACHE" ] && [ -d "$skills_dir" ] && [ -x "$real_claude" ] || return 0

    # agent-plugin-flox ships its skills without a Claude Code plugin
    # manifest, so build a plugin directory that links to them
    mkdir -p "$plugin_dir/.claude-plugin"
    local version
    version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' "$FLOX_ENV/share/agent-plugins/flox/plugin.json" 2>/dev/null)
    printf '{"name":"flox","version":"%s","description":"Flox skills (flox, floxify, flox-debug) from agent-stacks/agent-plugin-flox","author":{"name":"Flox"},"license":"Apache-2.0"}\n' \
        "${version:-0.0.0}" > "$plugin_dir/.claude-plugin/plugin.json.$$"
    mv -f "$plugin_dir/.claude-plugin/plugin.json.$$" "$plugin_dir/.claude-plugin/plugin.json"
    ln -sfn "$skills_dir" "$plugin_dir/skills"

    # PATH shim adds --plugin-dir unless flox@flox-skills is installed and enabled globally
    mkdir -p "$shim_dir"
    cat > "$shim_dir/.claude.$$" << EOF
#!/usr/bin/env bash
if grep -qs '"flox@flox-skills"' "\$HOME/.claude/plugins/installed_plugins.json" && grep -Eqs '"flox@flox-skills"[[:space:]]*:[[:space:]]*true' "\$HOME/.claude/settings.json"; then
    exec "$real_claude" "\$@"
fi
exec "$real_claude" --plugin-dir "$plugin_dir" "\$@"
EOF
    install_agentic_ollama_script "$shim_dir/.claude.$$" "$shim_dir/claude"
    case ":$PATH:" in
        *":$shim_dir:"*) ;;
        *) export PATH="$shim_dir:$PATH" ;;
    esac
}
setup_claude_flox_skills

# The Flox build of Codex reads skills from CODEX_FLOX_SKILL_ROOTS
# (colon-separated; any roots you set yourself are kept)
setup_codex_flox_skills() {
    local skills_dir="$FLOX_ENV/share/agent-plugins/flox/skills"
    [ -d "$skills_dir" ] || return 0
    case ":${CODEX_FLOX_SKILL_ROOTS:-}:" in
        *":$skills_dir:"*) ;;
        *) export CODEX_FLOX_SKILL_ROOTS="$skills_dir${CODEX_FLOX_SKILL_ROOTS:+:$CODEX_FLOX_SKILL_ROOTS}" ;;
    esac
}
setup_codex_flox_skills

# OpenCode merges the file named by OPENCODE_CONFIG with its other config, and
# launchers that set OPENCODE_CONFIG_CONTENT (e.g. newer `ollama launch`) don't
# override it. Falls back to OPENCODE_CONFIG_CONTENT if OPENCODE_CONFIG is taken.
setup_opencode_flox_skills() {
    local skills_dir="$FLOX_ENV/share/agent-plugins/flox/skills"
    local config="$FLOX_ENV_CACHE/opencode-flox-skills.json"
    local content="{\"skills\":{\"paths\":[\"$skills_dir\"]}}"
    [ -d "$skills_dir" ] || return 0
    if [ -z "${OPENCODE_CONFIG:-}" ] || [ "$OPENCODE_CONFIG" = "$config" ]; then
        printf '%s\n' "$content" > "$config"
        export OPENCODE_CONFIG="$config"
    elif [ -z "${OPENCODE_CONFIG_CONTENT:-}" ]; then
        export OPENCODE_CONFIG_CONTENT="$content"
    else
        echo "Note: OPENCODE_CONFIG and OPENCODE_CONFIG_CONTENT are both set; Flox skills not added to OpenCode" >&2
    fi
}
setup_opencode_flox_skills

# === DISPLAY CONFIGURATION ===
echo ""
echo "Ollama environment ready (headless mode)"
echo ""
echo "Server:"
echo "  Host: ${OLLAMA_HOST}"
if [ "$OLLAMA_MODELS" = "$HOME/.ollama/models" ]; then
  echo "  Models: ${OLLAMA_MODELS} (default)"
else
  echo "  Models: ${OLLAMA_MODELS} (custom)"
fi
if [ "$_FLOX_ENV_CUDA_DETECTION" = "1" ]; then
  echo "  GPU: Available (CUDA detected)"
else
  echo "  GPU: Not detected (CPU mode)"
fi
echo ""
echo "Commands:"
echo "  flox activate -s        Start Ollama service"
echo "  ollama pull <model>     Download a model"
echo "  ollama list             List local models"
echo "  ollama-info             Show configuration"
echo "  ollama-health           Test API endpoint"
echo "  helpf                   View full README documentation"
echo ""
echo "Examples:"
echo "  ollama pull llama2"
echo "  OLLAMA_HOST=0.0.0.0:11434 flox activate -s"
echo "  OLLAMA_MODELS=\$FLOX_ENV_CACHE/models flox activate -s  # Use project-local models"
echo ""

'''

[services]
ollama.command = "ollama serve"

[profile]
bash = '''
# Layering another environment on top puts its bin directories ahead of
# this environment's shims; move them back to the front
if [ -n "$AGENTIC_OLLAMA_SHIM_DIR" ] && [ -x "$AGENTIC_OLLAMA_SHIM_DIR/claude" ]; then
    case ":$PATH:" in
        ":$AGENTIC_OLLAMA_SHIM_DIR:"*) ;;
        *)
            # Drop the copy further down, so PATH doesn't grow each time
            agentic_ollama_path=":$PATH:"
            while [ "${agentic_ollama_path#*:"$AGENTIC_OLLAMA_SHIM_DIR":}" != "$agentic_ollama_path" ]; do
                agentic_ollama_path="${agentic_ollama_path%%:"$AGENTIC_OLLAMA_SHIM_DIR":*}:${agentic_ollama_path#*:"$AGENTIC_OLLAMA_SHIM_DIR":}"
            done
            agentic_ollama_path="${agentic_ollama_path#:}"
            PATH="$AGENTIC_OLLAMA_SHIM_DIR${agentic_ollama_path:+:${agentic_ollama_path%:}}"
            unset agentic_ollama_path
            ;;
    esac
fi
'''

zsh = '''
# Layering another environment on top puts its bin directories ahead of
# this environment's shims; move them back to the front
if [ -n "$AGENTIC_OLLAMA_SHIM_DIR" ] && [ -x "$AGENTIC_OLLAMA_SHIM_DIR/claude" ]; then
    case ":$PATH:" in
        ":$AGENTIC_OLLAMA_SHIM_DIR:"*) ;;
        *)
            # Drop the copy further down, so PATH doesn't grow each time
            agentic_ollama_path=":$PATH:"
            while [ "${agentic_ollama_path#*:"$AGENTIC_OLLAMA_SHIM_DIR":}" != "$agentic_ollama_path" ]; do
                agentic_ollama_path="${agentic_ollama_path%%:"$AGENTIC_OLLAMA_SHIM_DIR":*}:${agentic_ollama_path#*:"$AGENTIC_OLLAMA_SHIM_DIR":}"
            done
            agentic_ollama_path="${agentic_ollama_path#:}"
            PATH="$AGENTIC_OLLAMA_SHIM_DIR${agentic_ollama_path:+:${agentic_ollama_path%:}}"
            unset agentic_ollama_path
            ;;
    esac
fi
'''

fish = '''
# Layering another environment on top puts its bin directories ahead of
# this environment's shims; move them back to the front
if set -q AGENTIC_OLLAMA_SHIM_DIR; and test -x "$AGENTIC_OLLAMA_SHIM_DIR/claude"
    set -gx PATH $AGENTIC_OLLAMA_SHIM_DIR (string match -v -- $AGENTIC_OLLAMA_SHIM_DIR $PATH)
end
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
