fish = '''
if set -q FLOXENV_NANOBOT_VENV; and set -q FLOXENV_NANOBOT_SHIM_DIR
    set -gx VIRTUAL_ENV $FLOXENV_NANOBOT_VENV
    # Layering another environment on top puts its bin directories ahead of
    # the venv and the wrapper; move them back to the front
    set -gx PATH $FLOXENV_NANOBOT_VENV/bin (string match -v -- $FLOXENV_NANOBOT_VENV/bin $PATH)
    # The nanobot wrapper (unsets PYTHONPATH) goes ahead of the venv's nanobot
    set -gx PATH $FLOXENV_NANOBOT_SHIM_DIR (string match -v -- $FLOXENV_NANOBOT_SHIM_DIR $PATH)
end
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
