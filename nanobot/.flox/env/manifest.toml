schema-version = "1.11.0"

[install]
# Python 3.12 (not 3.13 — typer/click incompatibility)
python312.pkg-path = "python312Full"
uv.pkg-path = "uv"
# Node.js for the WhatsApp bridge
nodejs.pkg-path = "nodejs"
git.pkg-path = "gitFull"
git.outputs = "all"
curl.pkg-path = "curl"
bat.pkg-path = "bat"

[vars]
# API keys - set in your shell profile or pass at activation time
# ANTHROPIC_API_KEY = ""
# OPENAI_API_KEY = ""
# OPENROUTER_API_KEY = ""  (recommended - access to all models)

# Config lives in ~/.nanobot/config.json
# Run 'nanobot onboard --wizard' for interactive setup

[hook]
on-activate = '''
# === VENV BOOTSTRAP ===
NANOBOT_VENV="$FLOX_ENV_CACHE/venv"

if [ ! -d "$NANOBOT_VENV" ]; then
  echo "Creating nanobot venv..."
  uv venv "$NANOBOT_VENV" --python python3.12 --quiet
fi

# Install nanobot-ai if not present
if [ ! -f "$NANOBOT_VENV/bin/nanobot" ]; then
  echo "Installing nanobot-ai..."
  uv pip install --python "$NANOBOT_VENV/bin/python" nanobot-ai==0.1.5 --quiet
fi

# Activate the venv
export VIRTUAL_ENV="$NANOBOT_VENV"
export PATH="$NANOBOT_VENV/bin:$PATH"
# [profile] keeps these ahead of layered environments
export FLOXENV_NANOBOT_VENV="$NANOBOT_VENV"
export FLOXENV_NANOBOT_SHIM_DIR="$FLOX_ENV_CACHE/bin"

# nanobot, nanobot-info are scripts rather than [profile] functions, so
# each is written once for every shell and also works in scripts, agents, and
# `flox activate -- <name>`. They read the environment when they run.
# A script is moved into place only when it changed
install_nanobot_script() {
    local tmp="$1" dest="$2"
    if cmp -s "$tmp" "$dest"; then
        rm -f "$tmp"
    else
        chmod +x "$tmp"
        mv -f "$tmp" "$dest"
    fi
}

setup_nanobot_helpers() {
    local bin_dir="$FLOX_ENV_CACHE/bin"
    mkdir -p "$bin_dir"
    { echo '#!/usr/bin/env bash'
      printf 'FLOX_ENV=%q FLOX_ENV_CACHE=%q FLOX_ENV_PROJECT=%q\n' "$FLOX_ENV" "$FLOX_ENV_CACHE" "$FLOX_ENV_PROJECT"
      cat << 'NANOBOT_SCRIPT'
# Run nanobot without PYTHONPATH, which would mix other Python packages into
# the venv's
unset PYTHONPATH
exec "$FLOX_ENV_CACHE/venv/bin/nanobot" "$@"
NANOBOT_SCRIPT
    } > "$bin_dir/.nanobot.$$"
    install_nanobot_script "$bin_dir/.nanobot.$$" "$bin_dir/nanobot"
    { echo '#!/usr/bin/env bash'
      printf 'FLOX_ENV=%q FLOX_ENV_CACHE=%q FLOX_ENV_PROJECT=%q\n' "$FLOX_ENV" "$FLOX_ENV_CACHE" "$FLOX_ENV_PROJECT"
      cat << 'NANOBOT_INFO_SCRIPT'
nanobot-info() {
    echo "Nanobot Environment Configuration"
    echo ""
    echo "API Keys:"
    [ -n "$ANTHROPIC_API_KEY" ] && echo "  Anthropic: set" || echo "  Anthropic: not set"
    [ -n "$OPENAI_API_KEY" ] && echo "  OpenAI: set" || echo "  OpenAI: not set"
    [ -n "$OPENROUTER_API_KEY" ] && echo "  OpenRouter: set" || echo "  OpenRouter: not set"
    echo ""
    echo "Config: ~/.nanobot/config.json"
    echo "Venv:   $FLOX_ENV_CACHE/venv"
    echo ""
    echo "Commands:"
    echo "  nanobot onboard --wizard     Interactive first-time setup"
    echo "  nanobot agent                Interactive chat mode"
    echo "  nanobot agent -m \"<msg>\"     Single-message chat"
    echo "  nanobot gateway              Start channel gateway"
    echo "  nanobot serve                Start OpenAI-compatible API server"
    echo "  nanobot status               Show status"
    echo "  nanobot channels status      Show channel status"
    echo "  flox activate -s             Start gateway as Flox service"
    echo ""
    echo "Chat commands (in-session):"
    echo "  /new       New conversation"
    echo "  /dream     Run memory consolidation"
    echo "  /stop      Stop current task"
    echo "  /status    Show status"
    echo ""
    echo "Providers: OpenRouter (recommended), Anthropic, OpenAI,"
    echo "  Google Gemini, DeepSeek, Groq, Ollama, GitHub Copilot, 25+ more"
}
nanobot-info "$@"
NANOBOT_INFO_SCRIPT
    } > "$bin_dir/.nanobot-info.$$"
    install_nanobot_script "$bin_dir/.nanobot-info.$$" "$bin_dir/nanobot-info"
    case ":$PATH:" in *":$bin_dir:"*) ;; *) export PATH="$bin_dir:$PATH" ;; esac
}

setup_nanobot_helpers

# === DISPLAY CONFIGURATION ===
echo ""
echo "Nanobot environment ready"
echo ""
echo "Commands:"
echo "  nanobot onboard --wizard     Interactive first-time setup"
echo "  nanobot agent                Interactive chat mode"
echo "  nanobot agent -m \"<msg>\"     Single-message chat"
echo "  nanobot gateway              Start channel gateway (Telegram, Discord, WhatsApp, etc.)"
echo "  nanobot serve                Start OpenAI-compatible API server"
echo "  nanobot-info                 Show configuration"
echo ""

# First-time setup check
if [ ! -f "$HOME/.nanobot/config.json" ]; then
  echo "First time? Run: nanobot onboard --wizard"
  echo ""
fi
'''

[services.nanobot-gateway]
command = """
export VIRTUAL_ENV="$FLOX_ENV_CACHE/venv"
export PATH="$VIRTUAL_ENV/bin:$PATH"
unset PYTHONPATH
exec nanobot gateway 2>&1
"""
is-daemon = false

[profile]
bash = '''
if [ -n "$FLOXENV_NANOBOT_VENV" ] && [ -n "$FLOXENV_NANOBOT_SHIM_DIR" ]; then
    export VIRTUAL_ENV="$FLOXENV_NANOBOT_VENV"
    # Layering another environment on top puts its bin directories ahead of
    # the venv and the wrapper; move them back to the front
    floxenv_nanobot_venv_front_dir="$FLOXENV_NANOBOT_VENV/bin"
    case ":$PATH:" in
        ":$floxenv_nanobot_venv_front_dir:"*) ;;
        *)
            # Drop the copy further down, so PATH doesn't grow each time
            floxenv_nanobot_venv_front_path=":$PATH:"
            while [ "${floxenv_nanobot_venv_front_path#*:"$floxenv_nanobot_venv_front_dir":}" != "$floxenv_nanobot_venv_front_path" ]; do
                floxenv_nanobot_venv_front_path="${floxenv_nanobot_venv_front_path%%:"$floxenv_nanobot_venv_front_dir":*}:${floxenv_nanobot_venv_front_path#*:"$floxenv_nanobot_venv_front_dir":}"
            done
            floxenv_nanobot_venv_front_path="${floxenv_nanobot_venv_front_path#:}"
            PATH="$floxenv_nanobot_venv_front_dir${floxenv_nanobot_venv_front_path:+:${floxenv_nanobot_venv_front_path%:}}"
            ;;
    esac
    unset floxenv_nanobot_venv_front_dir floxenv_nanobot_venv_front_path
    # The nanobot wrapper (unsets PYTHONPATH) goes ahead of the venv's nanobot
    floxenv_nanobot_shim_front_dir="$FLOXENV_NANOBOT_SHIM_DIR"
    case ":$PATH:" in
        ":$floxenv_nanobot_shim_front_dir:"*) ;;
        *)
            # Drop the copy further down, so PATH doesn't grow each time
            floxenv_nanobot_shim_front_path=":$PATH:"
            while [ "${floxenv_nanobot_shim_front_path#*:"$floxenv_nanobot_shim_front_dir":}" != "$floxenv_nanobot_shim_front_path" ]; do
                floxenv_nanobot_shim_front_path="${floxenv_nanobot_shim_front_path%%:"$floxenv_nanobot_shim_front_dir":*}:${floxenv_nanobot_shim_front_path#*:"$floxenv_nanobot_shim_front_dir":}"
            done
            floxenv_nanobot_shim_front_path="${floxenv_nanobot_shim_front_path#:}"
            PATH="$floxenv_nanobot_shim_front_dir${floxenv_nanobot_shim_front_path:+:${floxenv_nanobot_shim_front_path%:}}"
            ;;
    esac
    unset floxenv_nanobot_shim_front_dir floxenv_nanobot_shim_front_path
fi
'''

